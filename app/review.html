<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reviewer sign-in · Notix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&display=swap">
<link rel="stylesheet" href="css/store.css">
<style>
  .rv { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; }
  .rv label { display: block; margin: 0 0 12px; font-size: 14.5px; color: var(--text-2); }
  .rv input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; height: 42px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--white); padding: 0 12px; font: 15px var(--mono); }
  .rv .msg { min-height: 22px; color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<div class="rv">
  <div class="eyebrow"><span class="code">NOTIX</span><a href="./" style="color:inherit">Back to the store</a></div>
  <h1>Reviewer sign-in</h1>
  <p class="muted">For payment-gateway website reviewers. Students sign in with their VIT Google account on the <a href="./">main page</a> instead.</p>
  <form id="rv">
    <label>Username<input id="ru" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="60" value="review@getnotespro" required></label>
    <label>Access code<input id="rc" type="password" autocomplete="current-password" maxlength="200" required></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="msg" id="rm" role="alert"></p>
  <p class="muted small">The reviewer account can open the store, choose a subject and go through the UPI checkout.</p>
  <p class="muted small"><a href="terms.html">Terms</a> · <a href="refund.html">Refunds</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy</a></p>
</div>
<script>
(function () {
  'use strict';
  const m = document.getElementById('rm');
  document.getElementById('rv').addEventListener('submit', async (e) => {
    e.preventDefault(); m.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ reviewUser: document.getElementById('ru').value, reviewCode: document.getElementById('rc').value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { m.textContent = j.error || 'Sign-in failed (' + r.status + ').'; return; }
      location.href = './';
    } catch (err) { m.textContent = 'Could not reach the site. Check your connection.'; }
  });
})();
</script>
</body>
</html>
